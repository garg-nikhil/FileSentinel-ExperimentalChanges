[package]
name = "filesentinel-desktop"
version = "8.2.0"
description = "FileSentinel Scalable Offline Windows Endpoint Compliance Application"
authors = ["FileSentinel Engineering"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["dialog-all", "shell-open", "fs-read-file", "path-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
